[package]
name = "zdb"
version = "0.1.0"
edition = "2021"
authors = ["Chasing1020"]
description = "A local key-value storage engine, inspired by LevelDB and RocksDB."
license = "Apache-2.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.81"
async-trait = "0.1.79"
bytes = "1.5.0"
crossbeam-skiplist = "0.1.3"
farmhash = "1.1.5"
integer-encoding = "4.0.0"
lz4 = "1.24.0"
moka = {version = "0.12.5", features = ["future"]}
ouroboros = "0.18.3"
parking_lot = "0.12.1"
serde = { version = "1.0.197", features = ["derive"] }
snap = "1.1.1"
thiserror = "1.0.58"
tokio = { version = "1.36.0", features = [
    "fs",
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "signal",
    "io-util",
] }
toml = "0.8.12"
zstd = "0.13.1"
